<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Aura</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="components/AppHeader.js" defer></script>
  <script src="components/AppFooter.js" defer></script>
  <style>
    .auth-wrapper { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
    .auth-card { width: 100%; max-width: 480px; padding: 3rem; }
  </style>
</head>
<body>
  <app-header></app-header>
  <main class="auth-wrapper py-12">
    <div class="card auth-card">
      <div class="text-center mb-8">
        <h2 class="serif mb-2">Create Account</h2>
        <p class="text-muted">Start planning your perfect event</p>
      </div>
      <form id="regForm">
        <div class="input-group">
          <label class="input-label">Full Name</label>
          <input type="text" class="input-field" placeholder="John Doe" required>
        </div>
        <div class="input-group">
          <label class="input-label">Email Address</label>
          <input type="email" class="input-field" placeholder="john@example.com" required>
        </div>
        <div class="input-group">
          <label class="input-label">Password</label>
          <input type="password" class="input-field" placeholder="Create a password" required>
        </div>
        <button type="submit" class="btn btn-accent w-full mb-6">Create Account</button>
        <p class="text-center text-sm text-muted">Already a client? <a href="login.html" class="text-accent font-semibold">Login</a></p>
      </form>
      <script>
        document.getElementById("regForm").addEventListener("submit", function(e) {
          e.preventDefault();
          const inputs = this.querySelectorAll("input");
          const name = inputs[0].value;
          const email = inputs[1].value;
          const password = inputs[2].value;

          if(name.length > 2 && email.includes("@") && password.length >= 6) {
            localStorage.setItem("aura_registered_name", name);
            localStorage.setItem("aura_registered_email", email);
            localStorage.setItem("aura_registered_password", password);
            alert("Registration successful! Please login with your new credentials.");
            window.location.href = "login.html";
          } else {
            alert("Please fill in valid details (min 6 char password).");
          }
        });
      </script>
    </div>
  </main>
  <app-footer></app-footer>
</body>
</html>
