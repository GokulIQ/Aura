<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Aura</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; padding: 2rem; }
    .auth-card { width: 100%; max-width: 480px; padding: 3rem; background: var(--bg-color); }
    
    .auth-controls { position: absolute; top: 1.5rem; right: 1.5rem; display: flex; gap: 0.5rem; z-index: 100; }
    html[dir="rtl"] .auth-controls { right: auto; left: 1.5rem; }
    
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--bg-color); box-shadow: var(--neo-shadow-sm); color: var(--text-dark); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); }
    .icon-btn:hover { box-shadow: var(--neo-inset-sm); color: var(--accent-color); }

    .brand-header { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 2rem; }
    .brand-header svg { width: 32px; height: 32px; color: var(--accent-color); }
    .brand-header h1 { margin: 0; font-size: 1.75rem; color: var(--accent-color); }

    /* RTL Support */
    html[dir="rtl"] { direction: rtl; }
    html[dir="rtl"] .input-label { text-align: right; }
    html[dir="rtl"] .text-center { text-align: center; }
    html[dir="rtl"] .input-field { text-align: right; }
    
    @media (max-width: 480px) {
      .auth-card { padding: 2rem 1.5rem; }
      .auth-wrapper { padding: 1rem; }
    }
  </style>
</head>
<body>
  
  <div class="auth-controls">
    <button class="icon-btn theme-toggle" title="Toggle Dark Mode" onclick="toggleTheme()"><i class="bi bi-moon"></i></button>
    <button class="icon-btn rtl-toggle" title="Toggle RTL" onclick="toggleRTL()"><i class="bi bi-translate"></i></button>
  </div>

  <main class="auth-wrapper">
    <div class="card auth-card">
      <a href="index.html" class="brand-header">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <circle cx="20" cy="20" r="19" fill="currentColor"/>
          <path d="M13.5 27.6L20 12.4L26.5 27.6M16.25 22.15H23.75" stroke="#FFFFFF" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1 class="serif">Aura.</h1>
      </a>

      <div class="text-center mb-8">
        <h2 class="serif mb-2">Create Account</h2>
        <p class="text-muted">Start planning your perfect event</p>
      </div>

      <form id="regForm">
        <div class="input-group">
          <label class="input-label">Full Name</label>
          <input type="text" class="input-field" placeholder="John Doe" required>
        </div>
        <div class="input-group">
          <label class="input-label">Email Address</label>
          <input type="email" class="input-field" placeholder="john@example.com" required>
        </div>
        <div class="input-group">
          <label class="input-label">Password</label>
          <input type="password" class="input-field" placeholder="Create a password" required>
        </div>
        
        <!-- Toast Message Container -->
        <div id="toastMessage" style="display: none; padding: 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem; text-align: center; font-weight: 500; background: var(--success); color: #fff;"></div>

        <button type="submit" class="btn btn-accent w-full mb-6">Create Account</button>
        <p class="text-center text-sm text-muted">Already a client? <a href="login.html" class="text-accent font-semibold">Login</a></p>
      </form>

      <script>
        // Theme & RTL Logic
        const applyTheme = () => {
          const theme = localStorage.getItem("festivo_theme") || "light";
          const icon = document.querySelector(".theme-toggle i");
          if (theme === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            if(icon) icon.className = "bi bi-sun";
          } else {
            document.documentElement.removeAttribute("data-theme");
            if(icon) icon.className = "bi bi-moon";
          }
        };
        const toggleTheme = () => {
          const isDark = document.documentElement.getAttribute("data-theme") === "dark";
          localStorage.setItem("festivo_theme", isDark ? "light" : "dark");
          applyTheme();
        };

        const applyRTL = () => {
          const dir = localStorage.getItem("festivo_dir") || "ltr";
          document.documentElement.setAttribute("dir", dir);
        };
        const toggleRTL = () => {
          const isRtl = document.documentElement.getAttribute("dir") === "rtl";
          localStorage.setItem("festivo_dir", isRtl ? "ltr" : "rtl");
          applyRTL();
        };

        // Initialize
        applyTheme();
        applyRTL();

        // Form Submit
        document.getElementById("regForm").addEventListener("submit", function(e) {
          e.preventDefault();
          const inputs = this.querySelectorAll("input");
          const name = inputs[0].value;
          const email = inputs[1].value;
          const password = inputs[2].value;
          const toast = document.getElementById("toastMessage");

          if(name.length > 2 && email.includes("@") && password.length >= 6) {
            localStorage.setItem("aura_registered_name", name);
            localStorage.setItem("aura_registered_email", email);
            localStorage.setItem("aura_registered_password", password);
            toast.style.display = "block";
            toast.style.background = "var(--success)";
            toast.textContent = "Account created successfully!";
          } else {
            toast.style.display = "block";
            toast.style.background = "var(--danger)";
            toast.textContent = "Please fill in valid details (min 6 char password).";
          }
        });
      </script>
    </div>
  </main>
</body>
</html>
