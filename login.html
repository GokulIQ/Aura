<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Aura</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="components/AppHeader.js" defer></script>
  <script src="components/AppFooter.js" defer></script>
  <style>
    .auth-wrapper { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
    .auth-card { width: 100%; max-width: 480px; padding: 3rem; }
  </style>
</head>
<body>
  <app-header></app-header>
  <main class="auth-wrapper py-12">
    <div class="card auth-card">
      <div class="text-center mb-8">
        <h2 class="serif mb-2">Welcome Back</h2>
        <p class="text-muted">Login to your Client Portal</p>
      </div>
      <form id="loginForm">
        <div class="input-group">
          <label class="input-label">Email or Mobile</label>
          <input type="text" class="input-field" placeholder="Enter your email or mobile" required>
        </div>
        <div class="input-group">
          <div class="d-flex justify-between align-center mb-2">
            <label class="input-label mb-0">Password</label>
            <a href="#" class="text-sm text-accent">Forgot?</a>
          </div>
          <input type="password" class="input-field" placeholder="Enter your password" required>
        </div>
        <div class="d-flex align-center gap-2 mb-6">
          <input type="checkbox" id="remember" style="width: 18px; height: 18px;">
          <label for="remember" class="text-sm text-muted">Remember me</label>
        </div>
        <button type="submit" class="btn btn-accent w-full mb-6">Login to Dashboard</button>
        <p class="text-center text-sm text-muted">New Client? <a href="register.html" class="text-accent font-semibold">Create Account</a></p>
      </form>
      <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
          e.preventDefault();
          const email = this.querySelector("input[type='text']").value;
          const pass = this.querySelector("input[type='password']").value;
          
          if (email && pass.length >= 3) {
            // If they haven't registered a specific name, use their email prefix as name for the demo
            if (!localStorage.getItem("aura_registered_name")) {
              const namePart = email.split("@")[0];
              const demoName = namePart.charAt(0).toUpperCase() + namePart.slice(1);
              localStorage.setItem("aura_registered_name", demoName || "Client");
            }
            
            localStorage.setItem("festivo_auth", "true");
            const urlParams = new URLSearchParams(window.location.search);
            const redirect = urlParams.get('redirect') || 'dashboard.html';
            window.location.href = redirect;
          } else {
            alert("Please enter any email and password to view the demo dashboard.");
          }
        });
      </script>
    </div>
  </main>
  <app-footer></app-footer>
</body>
</html>
