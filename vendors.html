<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendors Marketplace — Aura</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="components/AppHeader.js" defer></script>
  <script src="components/AppFooter.js" defer></script>
  <script src="components/VendorCard.js" defer></script>
  <style>
    .filter-bar { padding: 1.5rem; border-radius: var(--radius-full); margin-bottom: 3rem; display: flex; gap: 1rem; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-btn { padding: 0.5rem 1.25rem; border-radius: var(--radius-full); font-weight: 500; color: var(--text-muted); transition: var(--transition); cursor: pointer; border: none; background: transparent; }
    .filter-btn:hover { color: var(--accent-color); }
    .filter-btn.active { background: var(--bg-color); box-shadow: var(--neo-inset-sm); color: var(--accent-color); }
  </style>
</head>
<body>
  <app-header></app-header>
  <main>
    <section class="section pb-0">
      <div class="container text-center">
        <h1 class="serif section-title mb-4">Trusted Vendor Partners</h1>
        <p class="section-subtitle mb-8">Discover our hand-picked network of top-rated event professionals.</p>
        
        <div class="card card-inset filter-bar">
          <button class="filter-btn active">All</button>
          <button class="filter-btn">Decorators</button>
          <button class="filter-btn">Photographers</button>
          <button class="filter-btn">Caterers</button>
          <button class="filter-btn">Florists</button>
          <button class="filter-btn">DJs / Music</button>
          <button class="filter-btn">Makeup Artists</button>
          <button class="filter-btn">Bakers</button>
        </div>
      </div>
    </section>

    <section class="section pt-0">
      <div class="container">
        <div class="grid grid-cols-4 gap-6" id="vendors-grid">
          <vendor-card link="theme-details.html?id=bohemian-dream" name="Elite Decorations" category="Decorator" location="Mumbai" price="₹20,000" img="assets/Boho Celebration.jpg" rating="4.9"></vendor-card>
          <vendor-card link="theme-details.html?id=corporate-gala" name="Lens Magic Studios" category="Photographer" location="Mumbai" price="₹15,000" img="assets/Corporate Event Decoration Trends 2024.jpg" rating="4.8"></vendor-card>
          <vendor-card link="theme-details.html?id=rustic-romance" name="Gourmet Bites" category="Caterer" location="Mumbai" price="₹800/plate" img="assets/Rustic Romance.jpg" rating="4.7"></vendor-card>
          <vendor-card link="theme-details.html?id=pink-blossom" name="Bloom Floral Design" category="Florist" location="Navi Mumbai" price="₹10,000" img="assets/Pink Blossom.jpg" rating="4.9"></vendor-card>
          <vendor-card link="theme-details.html?id=princess-royale" name="Sweet Sensations" category="Baker" location="Mumbai" price="₹2,500" img="assets/Princess Royale.jpg" rating="5.0"></vendor-card>
          <vendor-card link="theme-details.html?id=team-celebration" name="DJ Soundscapes" category="DJs / Music" location="Thane" price="₹12,000" img="assets/Team Celebration.jpg" rating="4.6"></vendor-card>
          <vendor-card link="theme-details.html?id=minimalist-white" name="Classic Clicks" category="Photographer" location="Pune" price="₹18,000" img="assets/Minimal White Wedding.jpg" rating="4.8"></vendor-card>
          <vendor-card link="theme-details.html?id=royal-wedding" name="Royal Decor" category="Decorator" location="Mumbai" price="₹25,000" img="assets/Royal Wedding.jpg" rating="4.9"></vendor-card>
        </div>
      </div>
    </section>
  </main>
  <app-footer></app-footer>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const filterBtns = document.querySelectorAll(".filter-btn");
      const vendorCards = document.querySelectorAll("vendor-card");

      filterBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          // Remove active class from all buttons
          filterBtns.forEach(b => b.classList.remove("active"));
          // Add active class to clicked button
          btn.classList.add("active");

          const filterValue = btn.textContent.trim();

          vendorCards.forEach(card => {
            if (filterValue === "All") {
              card.style.display = "block";
            } else {
              const category = card.getAttribute("category") || "";
              // Match category exactly or handle plural/singular mappings if needed
              // However, the categories are singular in the card (Decorator, Photographer)
              // and plural on buttons (Decorators, Photographers). So we use includes.
              // For DJs / Music it matches exactly or includes.
              if (filterValue.toLowerCase().includes(category.toLowerCase()) || category.toLowerCase().includes(filterValue.toLowerCase())) {
                card.style.display = "block";
              } else {
                card.style.display = "none";
              }
            }
          });
        });
      });
    });
  </script>
</body>
</html>
