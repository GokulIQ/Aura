<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Overview — Aura</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="components/AppHeader.js" defer></script>
  <script src="components/AppFooter.js" defer></script>
  <script src="components/DashboardSidebar.js" defer></script>
  <style>
    .dashboard-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 2rem;
      align-items: start;
    }
    .dash-stat-card {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .dash-stat-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      background: var(--bg-color);
      box-shadow: var(--neo-inset-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--accent-color);
    }
    .progress-bar-container {
      width: 100%;
      height: 12px;
      background: var(--bg-color);
      box-shadow: var(--neo-inset-sm);
      border-radius: var(--radius-full);
      overflow: hidden;
      margin-top: 1rem;
    }
    .progress-bar {
      height: 100%;
      background: var(--accent-color);
      border-radius: var(--radius-full);
    }
    .event-stage {
      text-align: center;
      position: relative;
    }
    .stage-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--bg-color);
      box-shadow: var(--neo-shadow-sm);
      margin: 0 auto 0.5rem;
      border: 3px solid transparent;
    }
    .stage-dot.completed { background: var(--success); }
    .stage-dot.current { border-color: var(--accent-color); box-shadow: var(--neo-inset-sm); }
    @media (max-width: 1024px) {
      .dashboard-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <app-header></app-header>

  <main class="section" style="padding-top: 3rem;">
    <div class="container">
      <div class="dashboard-layout">
        <!-- Sidebar Component -->
        <dashboard-sidebar active="overview"></dashboard-sidebar>

        <!-- Main Content -->
        <div class="dash-content">
          <div class="d-flex justify-between align-center mb-6">
            <div>
              <h2 class="serif" id="welcome-heading">Welcome back, Sarah</h2>
              <p class="text-muted">Here is the status of your upcoming celebration.</p>
            </div>
            <span class="badge info">Planning in Progress</span>
          </div>

          <!-- Event Summary -->
          <div class="card mb-8">
            <div class="d-flex justify-between align-center mb-4">
              <h3 class="serif" id="event-heading">Sarah's 25th Birthday</h3>
              <p class="text-accent font-semibold"><i class="bi bi-calendar-event"></i> 15 September 2026</p>
            </div>
            <div class="progress-bar-container">
              <div class="progress-bar" style="width: 65%;"></div>
            </div>
            <p class="text-right text-sm text-muted mt-2">65% Completed</p>

            <div class="grid grid-cols-5 gap-4 mt-6">
              <div class="event-stage">
                <div class="stage-dot completed"></div>
                <span class="text-sm">Booking</span>
              </div>
              <div class="event-stage">
                <div class="stage-dot completed"></div>
                <span class="text-sm">Theme</span>
              </div>
              <div class="event-stage">
                <div class="stage-dot current"></div>
                <span class="text-sm">Vendors</span>
              </div>
              <div class="event-stage">
                <div class="stage-dot"></div>
                <span class="text-sm">Planning</span>
              </div>
              <div class="event-stage">
                <div class="stage-dot"></div>
                <span class="text-sm">Execution</span>
              </div>
            </div>
          </div>

          <!-- Stat Cards -->
          <div class="grid grid-cols-2 gap-6">
            <div class="card dash-stat-card">
              <div class="dash-stat-icon"><i class="bi bi-people"></i></div>
              <div>
                <p class="text-muted text-sm">Vendors Confirmed</p>
                <h4>3 / 4</h4>
              </div>
            </div>
            <div class="card dash-stat-card">
              <div class="dash-stat-icon"><i class="bi bi-check2-square"></i></div>
              <div>
                <p class="text-muted text-sm">Checklist</p>
                <h4>18 / 25 completed</h4>
              </div>
            </div>
            <div class="card dash-stat-card">
              <div class="dash-stat-icon"><i class="bi bi-receipt"></i></div>
              <div>
                <p class="text-muted text-sm">Total Invoice</p>
                <h4>?35,000</h4>
              </div>
            </div>
            <div class="card dash-stat-card">
              <div class="dash-stat-icon"><i class="bi bi-cash"></i></div>
              <div>
                <p class="text-muted text-sm">Outstanding</p>
                <h4 class="text-danger">?12,000</h4>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <app-footer></app-footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const userName = localStorage.getItem("aura_registered_name");
      if (userName) {
        const firstName = userName.split(" ")[0];
        const welcomeHeading = document.getElementById("welcome-heading");
        const eventHeading = document.getElementById("event-heading");
        if (welcomeHeading) welcomeHeading.textContent = `Welcome back, ${firstName}`;
        if (eventHeading) eventHeading.textContent = `${firstName}'s Event`;
      }
    });
  </script>
</body>
</html>
