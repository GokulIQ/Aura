<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — Aura</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="components/AppHeader.js" defer></script>
  <script src="components/AppFooter.js" defer></script>
</head>
<body>
  <app-header></app-header>
  <main>
    <section class="section">
      <div class="container">
        <h1 class="serif section-title text-center mb-4">Contact Us</h1>
        <p class="section-subtitle text-center mb-12">We would love to hear about your next event.</p>
        
        <div class="grid grid-cols-2 gap-8">
          <div class="card card-inset">
            <h3 class="serif mb-6">Send us a message</h3>
            <form>
              <div class="input-group">
                <label class="input-label">Name</label>
                <input type="text" class="input-field" placeholder="Your name">
              </div>
              <div class="input-group">
                <label class="input-label">Email</label>
                <input type="email" class="input-field" placeholder="Your email">
              </div>
              <div class="input-group">
                <label class="input-label">Message</label>
                <textarea class="input-field" rows="4" placeholder="Tell us about your event..."></textarea>
              </div>
              <button class="btn btn-accent w-full">Send Message</button>
            </form>
          </div>
          <div>
            <div class="card mb-6">
              <h4 class="mb-2"><i class="bi bi-geo-alt text-accent"></i> Visit Us</h4>
              <p class="text-muted">123 Celebration Ave, Mumbai, India</p>
            </div>
            <div class="card mb-6">
              <h4 class="mb-2"><i class="bi bi-telephone text-accent"></i> Call Us</h4>
              <p class="text-muted">+91 98765 43210</p>
            </div>
            <div class="card">
              <h4 class="mb-2"><i class="bi bi-envelope text-accent"></i> Email Us</h4>
              <p class="text-muted">hello@Aura.com</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <app-footer></app-footer>
</body>
</html>
