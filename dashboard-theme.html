<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Selection — Aura</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="components/AppHeader.js" defer></script>
  <script src="components/AppFooter.js" defer></script>
  <script src="components/DashboardSidebar.js" defer></script>
  <style>
    .dashboard-layout { display: grid; grid-template-columns: 280px 1fr; gap: 2rem; align-items: start; }
    .theme-preview-img { width: 100%; height: 350px; object-fit: cover; border-radius: var(--radius-md); margin-bottom: 1.5rem; }
    @media (max-width: 1024px) { .dashboard-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <app-header></app-header>
  <main class="section" style="padding-top: 3rem;">
    <div class="container">
      <div class="dashboard-layout">
        <dashboard-sidebar active="theme"></dashboard-sidebar>
        <div class="dash-content">
          <div class="d-flex justify-between align-center mb-6">
            <h2 class="serif">Current Selected Theme</h2>
            <span class="badge success">Confirmed</span>
          </div>
          
          <div class="card">
            <img src="assets/Boho Celebration.jpg" alt="Selected Theme" class="theme-preview-img">
            <div class="d-flex justify-between align-center">
              <div>
                <h3 class="serif mb-2">Bohemian Floral Dream</h3>
                <p class="text-muted">Selected on: 12 August 2026</p>
                <p class="text-muted mt-2">A beautiful mix of macrame, dried florals, and warm ambient lighting. Perfect for evening birthday celebrations.</p>
              </div>
              <button class="btn btn-primary" onclick="alert('Change theme modal will open.')">Change Theme</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <app-footer></app-footer>
</body>
</html>
